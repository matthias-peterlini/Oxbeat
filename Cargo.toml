[package]
name = "oxbeat"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Simple, friendly music making for Windows, macOS and Linux"
repository = "https://github.com/matthias-peterlini/Oxbeat"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37.0"
midir = "0.11.1"
rfd = "0.18.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.packager]
product-name = "Oxbeat"
identifier = "io.github.matthias-peterlini.oxbeat"
description = "Simple, friendly music making for Windows, macOS and Linux"
homepage = "https://github.com/matthias-peterlini/Oxbeat"
authors = ["Matthias Peterlini"]
publisher = "Matthias Peterlini"
license-file = "LICENSE"
category = "Music"
icons = ["assets/icon.png"]
out-dir = "target/packager"
binaries = [{ path = "oxbeat", main = true }]

[package.metadata.packager.deb]
depends = ["libasound2"]
