  <g fill="#2a2c32">
    <rect x="204" y="80" width="104" height="104" rx="24"/>
    <rect x="80" y="204" width="104" height="104" rx="24"/>
    <rect x="328" y="204" width="104" height="104" rx="24"/>
    <rect x="204" y="328" width="104" height="104" rx="24"/>
  </g>
  <g fill="#7fe0aa">
    <rect x="80" y="80" width="104" height="104" rx="24"/>
    <rect x="328" y="80" width="104" height="104" rx="24"/>
    <rect x="80" y="328" width="104" height="104" rx="24"/>
    <rect x="328" y="328" width="104" height="104" rx="24"/>
  </g>
  <rect x="204" y="204" width="104" height="104" rx="24" fill="#4a8ae4"/>
